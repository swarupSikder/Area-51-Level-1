<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area-51</title>

    <!-- RAW CSS-->
    <link rel="stylesheet" href="./styles/index.css">


    <!-- Tailwind Css-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="noto-serif-bengali-normal">

    <!--          -->
    <!--  Header  -->
    <!--          -->
    <header class="max-w-7xl m-auto">
        <nav class="flex justify-between m-2">
            <div class="bg-white rounded-full shadow-md border-gray-300 border-1">
                <img src="./images/logo.png" class="h-auto w-16 lg:w-24" alt="" srcset="">
            </div>

            <ul class="flex items-center justify-evenly gap-2 text-[10px] sm:text-sm md:text-base lg:text-base">
                <li
                    class="bg-blue-400 text-white px-2 sm:px-4 py-2 border border-gray-200 shadow-sm rounded-md cursor-pointer hover:bg-white hover:text-gray-600 transition">
                    হোম
                </li>

                <li
                    class="bg-white text-gray-600 px-2 sm:px-4 py-2 border border-gray-200 shadow-sm rounded-md cursor-pointer hover:bg-blue-400 hover:text-white transition">
                    টুর্নামেন্ট
                </li>

                <li
                    class="bg-white text-gray-600 px-2 sm:px-4 py-2 border border-gray-200 shadow-sm rounded-md cursor-pointer hover:bg-blue-400 hover:text-white transition">
                    ট্রান্সফার-উইন্ডো
                </li>

                <li>
                    <button type="button"
                        class="bg-amber-600 text-white px-2 sm:px-4 py-2 border border-gray-200 shadow-sm rounded-md cursor-pointer hover:bg-blue-400 transition">
                        একাউন্ট খুলুন
                    </button>
                </li>
            </ul>
        </nav>
    </header>






    <!--        -->
    <!--  Main  -->
    <!--        -->
    <main>

        <!--                -->
        <!--  Hero Section  -->
        <!--                -->
        <section class="relative max-w-5xl mx-auto w-full overflow-hidden mt-8">

            <h2 class="text-amber-600 text-center text-lg lg:text-3xl my-4">
                আমাদের ইতিহাস
            </h2>

            <div id="slides" class="flex transition-transform duration-700 ease-in-out rounded-xlm-4">

                <div class="min-w-full px-2">
                    <img src="./images/banner_1.png" alt="Banner 1" class="w-full border-2 border-gray-400 rounded-lg">
                </div>

                <div class="min-w-full px-2">
                    <img src="./images/banner_2.png" alt="Banner 2" class="w-full border-2 border-gray-400 rounded-lg">
                </div>

                <div class="min-w-full px-2">
                    <img src="./images/banner_3.png" alt="Banner 3" class="w-full border-2 border-gray-400 rounded-lg">
                </div>

                <div class="min-w-full px-2">
                    <img src="./images/banner_4.png" alt="Banner 4" class="w-full border-2 border-gray-400 rounded-lg">
                </div>

            </div>
        </section>

        <script>
            let currentSlide = 0;

            function autoSlide() {
                currentSlide++;

                if (currentSlide === 4) {
                    currentSlide = 0;
                }

                document.getElementById("slides").style.transform =
                    `translateX(-${currentSlide * 100}%)`;
            }

            setInterval(autoSlide, 5000);
        </script>





        <!--                      -->
        <!--  All Sports Section  -->
        <!--                      -->
        <section class="relative max-w-5xl mx-auto w-full overflow-hidden mt-32">

            <h2 class="text-amber-600 text-center text-lg lg:text-3xl my-4">
                স্পোর্টস অ্যারেঞ্জম্যান্ট রেকর্ডস
            </h2>

            <div class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">

                <!--Cricket-->
                <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">

                    <!-- Image -->
                    <div class="flex justify-center p-5 bg-gray-50">
                        <img src="./images/cricket.png" alt="ক্রিকেট" class="w-24 h-24 object-contain">
                    </div>

                    <!-- Title -->
                    <h3 class="text-center text-2xl font-bold text-amber-600 py-4">
                        ক্রিকেট
                    </h3>

                    <!-- Table -->
                    <div class="px-5 pb-5">
                        <table class="w-full border-collapse overflow-hidden rounded-lg">

                            <tbody>
                                <tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        মোট টুর্নামেন্ট
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ১
                                    </td>
                                </tr>

                                <tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        অফিসিয়াল ম্যাচ
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ১
                                    </td>
                                </tr>

                                <tr class="hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        সুপার কাপ
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ১
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>

                <!--Football-->
                <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">

                    <!-- Image -->
                    <div class="flex justify-center p-5 bg-gray-50">
                        <img src="./images/football.png" alt="ফুটবল" class="w-24 h-24 object-contain">
                    </div>

                    <!-- Title -->
                    <h3 class="text-center text-2xl font-bold text-amber-600 py-4">
                        ফুটবল
                    </h3>

                    <!-- Table -->
                    <div class="px-5 pb-5">
                        <table class="w-full border-collapse overflow-hidden rounded-lg">

                            <tbody>
                                <tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        মোট টুর্নামেন্ট
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ২
                                    </td>
                                </tr>

                                <tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        অফিসিয়াল ম্যাচ
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ৫৮
                                    </td>
                                </tr>

                                <tr class="hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        সুপার কাপ
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ০
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>

                <!--Badminton-->
                <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">

                    <!-- Image -->
                    <div class="flex justify-center p-5 bg-gray-50">
                        <img src="./images/badminton.png" alt="ব্যাডমিন্টন" class="w-24 h-24 object-contain">
                    </div>

                    <!-- Title -->
                    <h3 class="text-center text-2xl font-bold text-amber-600 py-4">
                        ব্যাডমিন্টন
                    </h3>

                    <!-- Table -->
                    <div class="px-5 pb-5">
                        <table class="w-full border-collapse overflow-hidden rounded-lg">

                            <tbody>
                                <tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        মোট টুর্নামেন্ট
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ৭
                                    </td>
                                </tr>

                                <tr class="border-b border-gray-200 hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        অফিসিয়াল ম্যাচ
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ৮৫৭
                                    </td>
                                </tr>

                                <tr class="hover:bg-blue-50 transition">
                                    <td class="px-4 py-3 text-gray-600 font-medium">
                                        সুপার কাপ
                                    </td>
                                    <td class="px-4 py-3 text-right font-bold text-blue-600">
                                        ০
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                </div>
            </div>
        </section>








    </main>







    <!--          -->
    <!--  Footer  -->
    <!--          -->
    <footer></footer>
</body>

</html>
